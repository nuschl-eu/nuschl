[package]
name = "nuschl-video-worker"
description = "Isolated video capture, encoding and decoding process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# GStreamer captures, scales and converts; the encoder core codes AV1 over VA-API.
vaapi = [
  "dep:gstreamer",
  "dep:gstreamer-allocators",
  "dep:gstreamer-app",
  "dep:gstreamer-video",
  "dep:cros-libva",
  "dep:nuschl-video-encode",
]

[dependencies]
nuschl-ipc.workspace = true
nuschl-sandbox.workspace = true
rav1d = { git = "https://github.com/memorysafety/rav1d", rev = "2e7216c20ac2a75de204d6c8d7268b75a45959b4", version = "1.1.1", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
rav1e = { version = "0.8.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# chromeos/cros-libva main: 0.0.13 has no packed-header buffers, which Mesa's AV1 encoder
# reads its frame state from. Move to a release that includes them.
cros-libva = { git = "https://github.com/chromeos/cros-libva", rev = "59384456ac2ae78c0c3e5515f41ef1efd9b802cf", version = "0.0.13", optional = true }
gstreamer = { version = "0.25.4", default-features = false, optional = true, features = ["v1_28"] }
gstreamer-allocators = { version = "0.25.4", default-features = false, optional = true, features = ["v1_28"] }
gstreamer-app = { version = "0.25.2", default-features = false, optional = true, features = ["v1_28"] }
gstreamer-video = { version = "0.25.4", default-features = false, optional = true, features = ["v1_28"] }
nuschl-ipc = { workspace = true, features = ["video-portal"] }
nuschl-video-encode = { workspace = true, optional = true }
pipewire = { version = "0.10.1", default-features = false }
tokio = { version = "1.54.1", features = ["macros", "rt"] }

[target.'cfg(windows)'.dependencies]
cameras = { version = "=0.3.2", default-features = false }
nuschl-sandbox-windows.workspace = true
windows-capture = "=2.0.1"

[target.'cfg(target_os = "macos")'.dependencies]
nuschl-capture-macos = { path = "../../crates/capture-macos", version = "0.3.0" }

[dev-dependencies]
nuschl-testkit.workspace = true
nuschl-video-encode.workspace = true
serde_json = "1.0.154"

[lints]
workspace = true
