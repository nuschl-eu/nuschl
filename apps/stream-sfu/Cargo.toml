[package]
name = "nuschl-stream-sfu"
description = "The companion SFU for calls and screen sharing: admits link holders and forwards encrypted media and key messages unchanged"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.22"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.13.0"
jiff = { version = "0.2", default-features = false, features = ["std"] }
nuschl-protocol.workspace = true
nuschl-stream-quality = { path = "../../crates/stream-quality", version = "0.3.0" }
nuschl-version.workspace = true
httparse = "1.10.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11"
sha2 = "0.11.1"
str0m = { version = "0.25.0", default-features = false, features = [
  "rust-crypto",
] }
tokio = { version = "1.54.1", features = [
  "macros",
  "rt",
  "net",
  "signal",
  "sync",
  "time",
] }
tokio-tungstenite = "0.29"
toml = { version = "1.2.1", default-features = false, features = [
  "std",
  "parse",
  "serde",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
nuschl-testkit.workspace = true
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
