[package]
name = "nuschl-ipc"
description = "Versioned bounded messages for Nuschl worker processes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
test-codec = []
video-portal = ["dep:ashpd", "dep:futures-util"]

[dependencies]
base64 = "0.22"
nuschl-core.workspace = true
nuschl-sandbox.workspace = true
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.154"
thiserror = "2.0.21"
zeroize = "1.9.1"
tokio = { version = "1.54.1", features = ["io-util", "macros", "process", "time", "rt", "sync"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "camera", "screencast"], optional = true }
futures-util = { version = "0.3", optional = true }
rustix = { version = "1.1.6", features = ["net", "pipe"] }
tokio = { version = "1.54.1", features = ["net"] }

[dev-dependencies]
nuschl-testkit.workspace = true

# Its own binary is the fake worker, so it brings its own main.
[[test]]
name = "exchange"
harness = false

[[test]]
name = "preview"
harness = false

[[bin]]
name = "worker-test-codec"
path = "src/bin/worker-test-codec.rs"
required-features = ["test-codec"]

[lints]
workspace = true
