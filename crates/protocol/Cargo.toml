[package]
name = "nuschl-protocol"
description = "Mumble schemas and bounded wire framing without a network runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aes = "0.8"
# The carried preview value its wire message converts to (docs/link-previews.md).
nuschl-core.workspace = true
bytes = "1.12.1"
hex = "0.4.3"
prost = "0.14.4"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"

[build-dependencies]
prost-build = "0.14.4"

[dev-dependencies]
serde_json = "1.0.154"
