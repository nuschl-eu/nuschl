# SPDX-License-Identifier: EUPL-1.2
# cargo-about configuration for the release notices (nix/release-notices.nix,
# docs/release-notices.md). The accepted licenses follow deny.toml; the first
# accepted alternative of an OR expression is the one whose text is shipped.
accepted = [
  "EUPL-1.2",
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Workspace members are first-party (EUPL-1.2, the LICENSE file).
private = { ignore = true }
# License files sit at the package root or one directory below it.
max-depth = 2

# deny.toml's Unlicense exceptions that ship (the transfer worker's Noise crates).
noise-protocol.accepted = ["Unlicense"]
noise-rust-crypto.accepted = ["Unlicense"]

